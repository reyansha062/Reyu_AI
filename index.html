<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reyu AI</title>
<style>
:root{--bg:#ffffff;--panel:#f1f2fb;--ink:#161628;--mute:#62647f;--user:#dfe0ff;--line:#dcdef0;--g1:#6d5efc;--g2:#22d3ee;--g3:#f472b6;--code:#12132a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b17;--panel:#16172b;--ink:#ececff;--mute:#9a9cc4;--user:#25264a;--line:#2a2c52}}
:root[data-theme="dark"]{--bg:#0b0b17;--panel:#16172b;--ink:#ececff;--mute:#9a9cc4;--user:#25264a;--line:#2a2c52}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));display:grid;place-items:center;color:#fff;font-weight:800}
header b{font-size:1.15rem;letter-spacing:.3px}
.sp{flex:1}
select,.ib{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:.85rem;cursor:pointer}
#chat{flex:1;overflow-y:auto;max-width:800px;width:100%;margin:0 auto;padding:10px 16px}
.hero{margin-top:6vh}
.hero h1{font-size:clamp(2.2rem,8vw,3.6rem);margin:0;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);font-size:1.1rem;margin:.3em 0 1.2em}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;min-height:84px}
.chip:hover{border-color:var(--g1)}
.msg{display:flex;gap:10px;margin:16px 0}
.me{justify-content:flex-end}
.me .b{background:var(--user);border-radius:18px 18px 4px 18px;padding:10px 15px;max-width:82%;white-space:pre-wrap;word-break:break-word}
.bot .logo{width:26px;height:26px;border-radius:8px;font-size:.8rem;flex:none;margin-top:2px}
.bot .b{max-width:92%;line-height:1.65;word-break:break-word;min-width:0}
.b pre{background:var(--code);color:#e8e8ff;border-radius:12px;padding:12px;overflow-x:auto;font-size:.82rem;margin:8px 0;position:relative}
.b code{font-family:ui-monospace,Menlo,Consolas,monospace}
.b :not(pre)>code{background:var(--panel);padding:1px 5px;border-radius:5px;font-size:.88em}
.b p{margin:.5em 0}
.act{margin-top:4px}.act button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:.78rem;padding:2px 6px}
.dots span{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%;background:var(--g1);animation:p 1s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--g2)}.dots span:nth-child(3){animation-delay:.3s;background:var(--g3)}
@keyframes p{50%{transform:translateY(-6px);opacity:.5}}
form{max-width:800px;width:100%;margin:0 auto;padding:8px 16px 4px}
.bar{display:flex;align-items:flex-end;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:6px 8px 6px 18px}
.bar textarea{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:1rem;padding:9px 0;resize:none;max-height:150px;min-width:0}
.go,.mic{border:0;width:40px;height:40px;border-radius:50%;font-size:1.05rem;cursor:pointer;flex:none}
.go{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.mic{background:none;color:var(--mute)}
.note{text-align:center;font-size:.72rem;color:var(--mute);padding:4px 16px 10px;margin:0}
</style>
</head>
<body>
<header>
<div class="logo">R</div><b>Reyu AI</b><div class="sp"></div>
<select id="mode" title="Power level"><option value="quick">⚡ Fast</option><option value="default" selected>🧠 Smart</option><option value="complex">🚀 Deep think</option></select>
<select id="persona" title="Skill"><option>Chat</option><option>Code</option><option>Write</option><option>Study</option><option>Research</option></select>
<button class="ib" id="exp" title="Download chat">⬇</button>
<button class="ib" id="new" title="New chat">＋</button>
</header>
<div id="chat"></div>
<form id="f"><div class="bar"><textarea id="in" rows="1" placeholder="Ask Reyu anything…"></textarea><button type="button" class="mic" id="mic" hidden aria-label="Dictate">🎤</button><button class="go" id="go" aria-label="Send">➤</button></div></form>
<p class="note">Reyu AI can make mistakes. Check important information.</p>
<script>
const $=id=>document.getElementById(id);
const chat=$("chat"),inp=$("in");
const S={msgs:[],busy:false,ac:null,sample:null};
const PERS={Chat:"Be a friendly, clear general assistant.",Code:"You are an expert software engineer. Give correct, runnable code in fenced blocks with short explanations.",Write:"You are a skilled writing partner. Produce polished, well-structured prose and offer a brief option to adjust tone.",Study:"You are a patient tutor. Explain step by step, use examples, and check understanding with a short question.",Research:"You are a careful analyst. Give a structured, balanced overview, separate facts from uncertainty, and say what to verify."};
const SYS="You are Reyu AI, a powerful, helpful and honest assistant. Never claim to be a different product. Use Markdown: short paragraphs, lists, and fenced code blocks. ";
try{S.msgs=JSON.parse(localStorage.getItem("reyu")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("reyu",JSON.stringify(S.msgs.slice(-60)))}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function md(t){
 const parts=t.split(/```/);
 return parts.map((p,i)=>{
  if(i%2){const nl=p.indexOf("\n");return "<pre><code>"+esc(nl>=0?p.slice(nl+1):p).replace(/\n$/,"")+"</code></pre>"}
  return esc(p).split(/\n{2,}/).map(x=>x.trim()?"<p>"+x.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")+"</p>":"").join("")
 }).join("");
}
function hero(){
 chat.innerHTML='<div class="hero"><h1>Hello, I’m Reyu</h1><p>Your powerful AI. Ask, build, write or learn anything.</p><div class="chips">'+
 [["💻","Build a Python web scraper step by step"],["🧠","Explain transformers like I’m 15"],["✍️","Write a launch post for my new app"],["📚","Make me a 4-week plan to learn machine learning"]].map(c=>'<button class="chip" data-q="'+c[1]+'">'+c[0]+" "+c[1]+"</button>").join("")+"</div></div>";
 chat.querySelectorAll(".chip").forEach(c=>c.onclick=()=>send(c.dataset.q));
}
function row(m,i){
 if(m.role==="user")return '<div class="msg me"><div class="b">'+esc(m.content)+"</div></div>";
 return '<div class="msg bot"><div class="logo">R</div><div><div class="b" id="m'+i+'">'+md(m.content)+'</div><div class="act"><button data-c="'+i+'">Copy</button></div></div></div>';
}
function render(){
 if(!S.msgs.length){hero();return}
 chat.innerHTML=S.msgs.map(row).join("");
 chat.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(S.msgs[+b.dataset.c].content).then(()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)}).catch(()=>{})});
 chat.scrollTop=chat.scrollHeight;
}
async function getSample(){
 if(S.sample)return S.sample;
 try{S.sample=await window.claude.use("sample")}catch(e){S.sample=null}
 return S.sample;
}
async function send(q){
 q=(q||"").trim();if(!q||S.busy)return;
 const sample=await getSample();
 S.msgs.push({role:"user",content:q});inp.value="";inp.style.height="auto";
 if(!sample){S.msgs.push({role:"assistant",content:"Reyu’s brain isn’t available in this view. Open this page inside claude.ai while signed in to chat with it."});save();render();return}
 S.msgs.push({role:"assistant",content:""});const bi=S.msgs.length-1;
 S.busy=true;$("go").textContent="■";render();
 const bub=$("m"+bi);bub.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
 const hist=S.msgs.slice(0,-1).slice(-24).map(m=>({role:m.role,content:m.content}));
 hist[0]={role:"user",content:"[Instructions: "+SYS+PERS[$("persona").value]+"]\n\n"+hist[0].content};
 if(hist[0].role!=="user")hist.shift();
 S.ac=new AbortController();
 try{
  const r=await sample(hist,{modelTier:$("mode").value,cache:false,signal:S.ac.signal,onText:({text})=>{S.msgs[bi].content=text;bub.innerHTML=md(text);chat.scrollTop=chat.scrollHeight}});
  S.msgs[bi].content=r.text||S.msgs[bi].content||"(no reply)";
 }catch(e){
  if(!S.msgs[bi].content)S.msgs[bi].content=e&&e.code==="not_granted"?"Permission was declined, so I can’t answer. Reload and allow it to chat.":e&&e.code==="rate_limited"?"Too many requests right now. Please wait a moment and try again.":"Something went wrong. Please try again.";
  else if(e&&e.name!=="AbortError"&&!(e.code==="aborted"))S.msgs[bi].content+="\n\n(interrupted)";
 }
 S.busy=false;$("go").textContent="➤";save();render();
}
$("f").onsubmit=e=>{e.preventDefault();if(S.busy){S.ac&&S.ac.abort();return}send(inp.value)};
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit()}});
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,150)+"px"});
$("new").onclick=()=>{if(S.busy&&S.ac)S.ac.abort();S.msgs=[];save();render()};
$("exp").onclick=async()=>{
 if(!S.msgs.length)return;
 try{const d=await window.claude.use("downloads");if(!d)return;
  await d.save({filename:"reyu-chat.md",data:S.msgs.map(m=>(m.role==="user"?"**You:** ":"**Reyu:** ")+m.content).join("\n\n")})}catch(e){}
};
(async()=>{try{const d=await window.claude.use("dictation");if(!d)return;const mic=$("mic");mic.hidden=false;let base="";
 d.onFinal(({text})=>{inp.value=(base+" "+text).trim();base=inp.value});
 d.onState(({state})=>{mic.textContent=state==="listening"?"⏺":"🎤"});
 mic.onclick=()=>{base=inp.value;d.start().catch(()=>{})}}catch(e){}})();
render();
</script>
</body>
</html>
